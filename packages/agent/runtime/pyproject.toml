[project]
name = "ailuo-agent"
version = "0.1.0"
description = "AI珞 Python Agent 运行时"
requires-python = ">=3.11,<3.15"
dependencies = [
    "grpcio==1.83.0",
    "grpcio-tools==1.83.0",
    "openai==2.17.0",
    "protobuf==7.35.1",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["agent/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
