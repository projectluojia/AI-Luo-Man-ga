syntax = "proto3";

package ailuo.executor.v1;

option go_package = "github.com/projectluojia/AI-Luo-Man-ga/contracts/pkg/executorv1;executorv1";

// ExecutorRuntime 是内核执行者会话协议：内核与任意能够驱动受治理 Run 会话的
// 执行者实现之间协商执行。执行者可以是规划器、工作流引擎或其他运行时。
service ExecutorRuntime {
  rpc Run(stream ExecutorFrame) returns (stream ExecutorFrame);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {
  repeated string accepted_protocol_versions = 1;
  reserved 2;
}

message HealthResponse {
  bool ready = 1;
  reserved 2;
  repeated string supported_protocol_versions = 3;
  string status_code = 4;
}

message ExecutorFrame {
  string echo_id = 1;
  string run_id = 2;
  uint64 sequence = 3;

  oneof body {
    StartRun start_run = 10;
    CapabilityCall capability_call = 11;
    CapabilityResult capability_result = 12;
    OutputDelta output_delta = 13;
    FinalResult final_result = 14;
    RunFailure run_failure = 15;
    CancelRun cancel_run = 16;
    RunAccepted run_accepted = 17;
    ResourceUsage resource_usage = 18;
  }
}

message StartRun {
  string app_id = 1;
  Payload input_payload = 2;
  reserved 3, 5, 6, 10, 11, 12, 13, 14, 15;
  repeated Capability capabilities = 4;
  uint32 max_steps = 7;
  string protocol_version = 8;
  uint32 max_capability_calls = 9;
  string trace_id = 16;
  string parent_span_id = 17;
  string parent_run_id = 18;
  Payload context_payload = 19;
  uint64 max_execution_units = 20;
  uint64 max_output_bytes = 21;
  uint64 max_cost_microusd = 22;
  Payload executor_config = 23;
}

message RunAccepted {
  string protocol_version = 1;
}

message ResourceUsage {
  uint64 execution_units = 1;
  uint64 cost_microusd = 2;
  uint32 retries = 3;
}

message Capability {
  string id = 1;
  string version = 2;
  string name = 3;
  string description = 4;
  string input_schema_json = 5;
}

message CapabilityCall {
  string call_id = 1;
  string capability_id = 2;
  bytes payload_json = 3;
}

message CapabilityResult {
  string call_id = 1;
  string capability_id = 2;
  bool success = 3;
  bytes payload_json = 4;
  string error_code = 5;
  string error_message = 6;
}

message Payload {
  string content_type = 1;
  bytes data = 2;
}

message OutputDelta {
  Payload payload = 1;
}

message FinalResult {
  Payload payload = 1;
}

message RunFailure {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message CancelRun {
  string reason = 1;
}
