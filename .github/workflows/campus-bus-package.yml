name: Campus bus package

# 过渡期包仍在本仓库，但拥有独立的 CI 边界；迁移到 packages/campus-bus 独立仓库时
# 可直接携带本文件。该流程不依赖 Agent 包，也不参与 Core 的 ci-required。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-bus-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Campus bus package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/campus-bus/go.mod
          cache: true
      - name: 校验校巴 Go module 与 WASM 构建
        working-directory: packages/campus-bus
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy -diff
          GOOS=wasip1 GOARCH=wasm go vet ./src
          GOOS=wasip1 GOARCH=wasm go build -trimpath -o "$RUNNER_TEMP/campus.wasm" ./src
      - name: 构建 Package Manager CLI
        working-directory: package-manager
        run: go build -o ../ailuo ./cmd/ailuo-pm
      - name: 打包 Campus bus
        run: ./ailuo pack packages/campus-bus "$RUNNER_TEMP/campus-package-dist"
      - name: 安装并验证 Campus 发布物
        shell: bash
        run: |
          set -euo pipefail
          campus_tgz="$(find "$RUNNER_TEMP/campus-package-dist" -maxdepth 1 -type f -name 'campus-*.tgz' -print -quit)"
          test -n "$campus_tgz"
          campus_version="$(tar -xzOf "$campus_tgz" manifest.json | jq -er .version)"
          ./ailuo install --root "$RUNNER_TEMP/campus-package-root" "$campus_tgz"
          ./ailuo list --root "$RUNNER_TEMP/campus-package-root" | grep -q "^campus@${campus_version}"
