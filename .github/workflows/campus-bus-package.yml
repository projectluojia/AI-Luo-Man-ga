name: Campus bus package

# Campus bus 包拥有独立的 CI 边界；迁移到独立仓库时可直接携带本文件。
# 该流程不依赖 Agent 包，也不参与 Core 的 ci-required。

on:
  push:
    branches: [main]
    paths:
      - packages/campus-bus/**
      - contracts/**
      - package-manager/**
      - go.work
      - go.work.sum
      - .github/workflows/campus-bus-package.yml
  pull_request:
    paths:
      - packages/campus-bus/**
      - contracts/**
      - package-manager/**
      - go.work
      - go.work.sum
      - .github/workflows/campus-bus-package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-bus-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Campus bus package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/campus-bus/go.mod
          cache: true
          cache-dependency-path: |
            packages/campus-bus/go.mod
            contracts/go.sum
            package-manager/go.sum
            go.work.sum
      - name: 校验校巴 Go module 与 WASM 构建
        working-directory: packages/campus-bus
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy -diff
          GOOS=wasip1 GOARCH=wasm go vet ./src
      - name: 构建 Package Manager CLI
        working-directory: package-manager
        run: |
          go build -o "$RUNNER_TEMP/ailuo" ./cmd/ailuo-pm
      - name: 打包 Campus bus
        run: |
          "$RUNNER_TEMP/ailuo" pack packages/campus-bus "$RUNNER_TEMP/campus-package-dist"
      - name: 安装并验证 Campus 发布物
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t campus_tarballs < <(find "$RUNNER_TEMP/campus-package-dist" -maxdepth 1 -type f -name 'campus-*.tgz' -print)
          test "${#campus_tarballs[@]}" -eq 1
          campus_tgz="${campus_tarballs[0]}"
          campus_version="$(tar -xzOf "$campus_tgz" manifest.json | jq -er .version)"
          "$RUNNER_TEMP/ailuo" install --root "$RUNNER_TEMP/campus-package-root" "$campus_tgz"
          "$RUNNER_TEMP/ailuo" list --root "$RUNNER_TEMP/campus-package-root" | grep -q "^campus@${campus_version}"
