name: Agent executor package

# Agent 包拥有独立的 CI 边界；迁移到独立仓库时可直接携带本文件。
# Core→Executor 的 e2e 只依赖 Agent 包，不捆绑其他业务包。

on:
  push:
    branches: [main]
    paths:
      - packages/agent/**
      - contracts/**
      - package-manager/**
      - e2e/**
      - internal/**
      - testsupport/**
      - proto/**
      - gen/**
      - go.mod
      - go.sum
      - go.work
      - go.work.sum
      - .github/workflows/agent-package.yml
  pull_request:
    paths:
      - packages/agent/**
      - contracts/**
      - package-manager/**
      - e2e/**
      - internal/**
      - testsupport/**
      - proto/**
      - gen/**
      - go.mod
      - go.sum
      - go.work
      - go.work.sum
      - .github/workflows/agent-package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Agent executor package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: packages/agent/runtime/uv.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: package-manager/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            contracts/go.sum
            package-manager/go.sum
            go.work.sum
      - name: 构建 Package Manager CLI
        working-directory: package-manager
        run: |
          go build -o "$RUNNER_TEMP/ailuo" ./cmd/ailuo-pm
      - name: 打包 Agent Executor
        run: |
          "$RUNNER_TEMP/ailuo" pack packages/agent "$RUNNER_TEMP/agent-package-dist"
      - name: 同步 Executor 包测试环境
        run: uv sync --project packages/agent/runtime --locked
      - name: 编译 Executor 包
        run: uv run --project packages/agent/runtime --locked python -m compileall -q packages/agent/runtime
      - name: 检查 Executor 包代码
        working-directory: packages/agent/runtime
        run: uv run --project . --locked ruff check .
      - name: 运行 Executor 包单元测试
        run: uv run --project packages/agent/runtime --locked python -m unittest discover -s packages/agent/runtime -p "test_*.py" -v
      - name: 安装并验证 Agent 发布物
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t agent_tarballs < <(find "$RUNNER_TEMP/agent-package-dist" -maxdepth 1 -type f -name 'agent-*.tgz' -print)
          test "${#agent_tarballs[@]}" -eq 1
          agent_tgz="${agent_tarballs[0]}"
          agent_version="$(tar -xzOf "$agent_tgz" manifest.json | jq -er .version)"
          "$RUNNER_TEMP/ailuo" install --root "$RUNNER_TEMP/agent-package-root" "$agent_tgz"
          "$RUNNER_TEMP/ailuo" list --root "$RUNNER_TEMP/agent-package-root" | grep -q "^agent@${agent_version}"
      - name: 运行 Core→Executor 安装后 e2e
        shell: bash
        run: |
          AILUO_EXECUTOR_PACKAGE_DIR="$RUNNER_TEMP/agent-package-root/agent" \
            go test -tags=integration ./e2e -v -timeout=60s
