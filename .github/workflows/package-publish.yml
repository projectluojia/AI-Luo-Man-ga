name: 包发布流水线（可复用）

# npm 式包发布流水线：构建 → 版本一致性 → pack（tarball）→ 冒烟安装验证 →
# （tag 发布时）附 GitHub Release。包作者仓库通过
# `uses: projectluojia/AI-Luo-Man-ga/.github/workflows/package-publish.yml@ref`
# 复用；CLI 从本仓库固定提交构建，不能把调用方源码当作 CLI 仓库。

on:
  workflow_call:
    inputs:
      package-dir:
        type: string
        default: "."
        description: 源包目录（含 ailuo.toml 或 manifest.json 与 entrypoint 工件）
      build-command:
        type: string
        default: ""
        description: 在 package-dir 内构建工件的命令；空表示工件已提交
      tag-required:
        type: boolean
        default: false
        description: 要求 git tag（去 v 前缀）与 manifest.version 一致并发布 Release
    outputs:
      package-id:
        description: 打包出的包 ID
        value: ${{ jobs.package.outputs.package-id }}
      package-version:
        description: 打包出的包版本
        value: ${{ jobs.package.outputs.package-version }}
      tarball:
        description: 生成的 tarball 相对路径
        value: ${{ jobs.package.outputs.tarball }}

permissions:
  contents: read

jobs:
  package:
    # 发布 job 需要写 contents（gh release create）；PR 冒烟运行同为只读命令。
    permissions:
      contents: write
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package-id: ${{ steps.pack.outputs.package-id }}
      package-version: ${{ steps.pack.outputs.package-version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: projectluojia/AI-Luo-Man-ga
          ref: 59a056d95bee0e6f0f41484b1753892f514edb70
          path: .ailuo-cli
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .ailuo-cli/go.mod
          cache: true
      - name: 构建 ailuo CLI
        run: go build -o ailuo .
        working-directory: .ailuo-cli
      - name: 构建包工件
        if: ${{ inputs.build-command != '' }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"
        working-directory: ${{ inputs.package-dir }}
      - name: 打包并冒烟安装验证
        id: pack
        shell: bash
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
        run: |
          set -euo pipefail
          ./.ailuo-cli/ailuo pack "$PACKAGE_DIR" dist
          tarball="$(ls dist/*.tgz)"
          manifest="$(tar -xzOf "$tarball" manifest.json)"
          id="$(jq -er .id <<<"$manifest")"
          version="$(jq -er .version <<<"$manifest")"
          # 发布物必须可安装并可列出（真实闭环，不信任"打包成功"本身）。
          ./.ailuo-cli/ailuo install --root "$RUNNER_TEMP/pkgroot" "$tarball"
          ./.ailuo-cli/ailuo list --root "$RUNNER_TEMP/pkgroot" | grep -q "^${id}@${version}"
          echo "package-id=$id" >> "$GITHUB_OUTPUT"
          echo "package-version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: 校验包版本与 git tag 一致
        if: ${{ inputs.tag-required }}
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          tag="${tag#v}"
          version="${{ steps.pack.outputs.package-version }}"
          test "$tag" = "$version" || {
            echo "git tag $tag 与包版本 $version 不一致" >&2
            exit 1
          }
      - name: 发布到 GitHub Release（tag 时，版本不可变）
        if: ${{ inputs.tag-required }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_DIR: ${{ inputs.package-dir }}
          REPOSITORY: ${{ github.repository }}
        run: ./.ailuo-cli/ailuo publish --repo "$REPOSITORY" "$PACKAGE_DIR"
      - name: 从注册表安装验证（发布物真实闭环）
        if: ${{ inputs.tag-required }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_DIR: ${{ inputs.package-dir }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          id="${{ steps.pack.outputs.package-id }}"
          version="${{ steps.pack.outputs.package-version }}"
          ./.ailuo-cli/ailuo install --root "$RUNNER_TEMP/pkgroot-registry" "$REPOSITORY@$version"
          ./.ailuo-cli/ailuo list --root "$RUNNER_TEMP/pkgroot-registry" | grep -q "^${id}@${version}"
