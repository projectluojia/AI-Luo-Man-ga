name: 包发布流水线（可复用）

# npm 式包发布流水线：构建 → pack（tarball）→ 冒烟安装验证 → 版本一致性 →
# （tag 发布时）附 GitHub Release。包作者仓库通过
# `uses: projectluojia/AI-Luo-Man-ga/.github/workflows/package-publish.yml@ref`
# 复用；调用方必须显式传入不可变 package-manager-ref，不能把调用方提交 SHA
# 猜作 CLI 仓库中的提交。
#
# 打包与发布分两个 job：package 只读（PR 冒烟走这条路，且它执行调用方传入的
# build-command），contents: write 只在 tag 触发的 publish job 里存在；发布 job
# 只处理 package job 生成的 tarball，不执行调用方构建命令。构建器工具链只按
# 调用方声明的 build-tool 条件准备，不绑定任何具体业务包。

on:
  workflow_call:
    inputs:
      package-dir:
        type: string
        default: "."
        description: 源包目录（含 ailuo.toml 或源码与 entrypoint 工件）
      package-manager-ref:
        type: string
        required: true
        description: AI珞 Package Manager 的完整 40 位 commit SHA
      build-tool:
        type: string
        required: true
        description: 与 ailuo.toml [build].tool 一致；无构建器时填写 none
      uv-version:
        type: string
        default: ""
        description: python-uv 构建器使用的完整 uv 版本（x.y.z）
      node-version:
        type: string
        default: ""
        description: ts-as 构建器使用的完整 Node.js 版本（x.y.z）
      build-command:
        type: string
        default: ""
        description: 在 package-dir 内构建工件的命令；空表示工件已提交
      test-command:
        type: string
        required: true
        description: 在 package-dir 内运行的发布前测试命令
      tag-required:
        type: boolean
        default: false
        description: 要求 git tag（去 v 前缀）与 manifest.version 一致并发布 Release
    outputs:
      package-id:
        description: 打包出的包 ID
        value: ${{ jobs.package.outputs.package-id }}
      package-version:
        description: 打包出的包版本
        value: ${{ jobs.package.outputs.package-version }}
      artifact-id:
        description: 已验证 tarball 的 workflow artifact ID
        value: ${{ jobs.package.outputs.artifact-id }}

permissions:
  contents: read

concurrency:
  group: package-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      package-id: ${{ steps.pack.outputs.package-id }}
      package-version: ${{ steps.pack.outputs.package-version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 校验 Package Manager ref
        env:
          PACKAGE_MANAGER_REF: ${{ inputs.package-manager-ref }}
        shell: bash
        run: |
          [[ "$PACKAGE_MANAGER_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "package-manager-ref 必须是完整 40 位 commit SHA" >&2
            exit 1
          }
      # Package Manager 仓库与调用方包仓库分离，固定到调用方显式提供的 ref。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: projectluojia/AI-Luo-Man-ga
          ref: ${{ inputs.package-manager-ref }}
          path: .ailuo-cli
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .ailuo-cli/package-manager/go.mod
          cache: true
          cache-dependency-path: |
            .ailuo-cli/contracts/go.sum
            .ailuo-cli/package-manager/go.sum
            .ailuo-cli/go.work.sum
      - name: 校验构建器与工具链版本
        env:
          BUILD_TOOL: ${{ inputs.build-tool }}
          UV_VERSION: ${{ inputs.uv-version }}
          NODE_VERSION: ${{ inputs.node-version }}
        shell: bash
        run: |
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          case "$BUILD_TOOL" in
            none|go-wasm) ;;
            python-uv)
              [[ "$UV_VERSION" =~ $version_pattern ]] || {
                echo "python-uv 必须传入完整 uv 版本 x.y.z" >&2
                exit 1
              }
              ;;
            ts-as)
              [[ "$NODE_VERSION" =~ $version_pattern ]] || {
                echo "ts-as 必须传入完整 Node.js 版本 x.y.z" >&2
                exit 1
              }
              ;;
            *)
              echo "不支持的 build-tool: $BUILD_TOOL" >&2
              exit 1
              ;;
          esac
      # 包构建器是包格式的通用能力；workflow 只按 manifest 声明准备工具链。
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: ${{ inputs.build-tool == 'python-uv' }}
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ inputs.build-tool == 'ts-as' }}
        with:
          node-version: ${{ inputs.node-version }}
      - name: 构建 ailuo CLI
        run: go build -o "$RUNNER_TEMP/ailuo" ./cmd/ailuo-pm
        working-directory: .ailuo-cli/package-manager
      - name: 构建包工件
        if: ${{ inputs.build-command != '' }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          PACKAGE_DIR: ${{ inputs.package-dir }}
        run: cd "$PACKAGE_DIR" && bash -euo pipefail -c "$BUILD_COMMAND"
      - name: 测试包工件
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: cd "$PACKAGE_DIR" && bash -euo pipefail -c "$TEST_COMMAND"
      - name: 打包并冒烟安装验证
        id: pack
        shell: bash
        # 调用方输入经 env 传入：直接插值进 run: 会把输入当脚本片段拼接。
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
        run: |
          set -euo pipefail
          package_version="0.1.0"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            package_version="${GITHUB_REF#refs/tags/}"
            package_version="${package_version#v}"
          fi
          output_dir="$(mktemp -d "$RUNNER_TEMP/ailuo-package.XXXXXX")"
          "$RUNNER_TEMP/ailuo" pack --version "$package_version" "$PACKAGE_DIR" "$output_dir"
          mapfile -t tarballs < <(find "$output_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          # pack 的输出目录是第二个位置参数；flag 必须在位置参数之前
          # （Go flag 包遇到首个位置参数即停止解析）。
          # id/version 的权威来源是 tarball 根的 manifest.json：文件名形如
          # <id>-<version>.tgz，用 ${base%-*} 切分会在预发布版本（1.0.0-rc.1）上切错。
          manifest="$(tar -xzOf "$tarball" manifest.json)"
          id="$(jq -er .id <<<"$manifest")"
          version="$(jq -er .version <<<"$manifest")"
          # 发布物必须可安装并可列出（真实闭环，不信任"打包成功"本身）。
          "$RUNNER_TEMP/ailuo" install --root "$RUNNER_TEMP/pkgroot" "$tarball"
          "$RUNNER_TEMP/ailuo" list --root "$RUNNER_TEMP/pkgroot" | grep -q "^${id}@${version}"
          {
            echo "package-id=$id"
            echo "package-version=$version"
            echo "tarball-path=$tarball"
          } >> "$GITHUB_OUTPUT"
      - name: 校验包版本与 git tag 一致
        if: ${{ inputs.tag-required }}
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.pack.outputs.package-version }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          tag="${tag#v}"
          test "$tag" = "$PACKAGE_VERSION" || {
            echo "git tag $tag 与包版本 $PACKAGE_VERSION 不一致" >&2
            exit 1
          }

      - name: 上传已验证发布物
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ailuo-package
          path: ${{ steps.pack.outputs.tarball-path }}
          if-no-files-found: error
          retention-days: 7

  # Release 发布单独成 job：只有它需要 contents: write，且只在 tag 发布时运行。
  publish:
    name: publish
    needs: package
    if: ${{ inputs.tag-required && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read # 下载 package job 的已验证 tarball。
      contents: write # 上传并发布经过验证的不可变 Release 工件。
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: package-artifact
      - name: 校验 Package Manager ref
        env:
          PACKAGE_MANAGER_REF: ${{ inputs.package-manager-ref }}
        shell: bash
        run: |
          [[ "$PACKAGE_MANAGER_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "package-manager-ref 必须是完整 40 位 commit SHA" >&2
            exit 1
          }
      # 只检出指定 ref 中的 Package Manager；不检出或执行调用方仓库代码。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: projectluojia/AI-Luo-Man-ga
          ref: ${{ inputs.package-manager-ref }}
          path: .ailuo-cli
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .ailuo-cli/package-manager/go.mod
          cache: true
          cache-dependency-path: |
            .ailuo-cli/contracts/go.sum
            .ailuo-cli/package-manager/go.sum
            .ailuo-cli/go.work.sum
      - name: 构建 ailuo CLI
        run: go build -o "$RUNNER_TEMP/ailuo" ./cmd/ailuo-pm
        working-directory: .ailuo-cli/package-manager
      - name: 发布到 GitHub Release（tag 时，版本不可变）
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACKAGE_TARBALL_DIR: ${{ github.workspace }}/package-artifact
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find "$PACKAGE_TARBALL_DIR" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          "$RUNNER_TEMP/ailuo" publish --repo "$REPOSITORY" "$tarball"
      - name: 从注册表安装验证（发布物真实闭环）
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACKAGE_ID: ${{ needs.package.outputs.package-id }}
          PACKAGE_VERSION: ${{ needs.package.outputs.package-version }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ailuo" install --root "$RUNNER_TEMP/pkgroot-registry" "$REPOSITORY@$PACKAGE_VERSION"
          "$RUNNER_TEMP/ailuo" list --root "$RUNNER_TEMP/pkgroot-registry" | grep -q "^${PACKAGE_ID}@${PACKAGE_VERSION}"
