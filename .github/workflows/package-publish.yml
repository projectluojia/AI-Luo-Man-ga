name: 包发布流水线（可复用）

# npm 式包发布流水线：构建 → pack（tarball）→ 冒烟安装验证 → 版本一致性 →
# （tag 发布时）附 GitHub Release。包作者仓库通过
# `uses: projectluojia/AI-Luo-Man-ga/.github/workflows/package-publish.yml@ref`
# 复用；CLI 从本仓库固定提交构建，不能把调用方源码当作 CLI 仓库。
#
# 打包与发布分两个 job：package 只读（PR 冒烟走这条路，且它执行调用方传入的
# build-command），contents: write 只在 tag 触发的 publish job 里存在；发布 job
# 只处理 package job 生成的 tarball，不执行调用方构建命令。

on:
  workflow_call:
    inputs:
      package-dir:
        type: string
        default: "."
        description: 源包目录（含 ailuo.toml 或源码与 entrypoint 工件）
      build-command:
        type: string
        default: ""
        description: 在 package-dir 内构建工件的命令；空表示工件已提交
      tag-required:
        type: boolean
        default: false
        description: 要求 git tag（去 v 前缀）与 manifest.version 一致并发布 Release
    outputs:
      package-id:
        description: 打包出的包 ID
        value: ${{ jobs.package.outputs.package-id }}
      package-version:
        description: 打包出的包版本
        value: ${{ jobs.package.outputs.package-version }}
      tarball:
        description: 生成的 tarball 相对路径
        value: ${{ jobs.package.outputs.tarball }}

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      package-id: ${{ steps.pack.outputs.package-id }}
      package-version: ${{ steps.pack.outputs.package-version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CLI 仓库与调用方包仓库分离，并固定到已验证提交。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: projectluojia/AI-Luo-Man-ga
          ref: e7d0d0ace4d7f01bb704513159d9a760cc82c28d
          path: .ailuo-cli
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .ailuo-cli/go.mod
          cache: true
      - name: 构建 ailuo CLI
        run: go build -o ailuo .
        working-directory: .ailuo-cli
      - name: 构建包工件
        if: ${{ inputs.build-command != '' }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"
        working-directory: ${{ inputs.package-dir }}
      - name: 打包并冒烟安装验证
        id: pack
        shell: bash
        # 调用方输入经 env 传入：直接插值进 run: 会把输入当脚本片段拼接。
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
        run: |
          set -euo pipefail
          ./.ailuo-cli/ailuo pack "$PACKAGE_DIR" dist
          tarball="$(ls dist/*.tgz)"
          # pack 的输出目录是第二个位置参数；flag 必须在位置参数之前
          # （Go flag 包遇到首个位置参数即停止解析）。
          # id/version 的权威来源是 tarball 根的 manifest.json：文件名形如
          # <id>-<version>.tgz，用 ${base%-*} 切分会在预发布版本（1.0.0-rc.1）上切错。
          manifest="$(tar -xzOf "$tarball" manifest.json)"
          id="$(jq -er .id <<<"$manifest")"
          version="$(jq -er .version <<<"$manifest")"
          # 发布物必须可安装并可列出（真实闭环，不信任"打包成功"本身）。
          ./.ailuo-cli/ailuo install --root "$RUNNER_TEMP/pkgroot" "$tarball"
          ./.ailuo-cli/ailuo list --root "$RUNNER_TEMP/pkgroot" | grep -q "^${id}@${version}"
          echo "package-id=$id" >> "$GITHUB_OUTPUT"
          echo "package-version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: 校验包版本与 git tag 一致
        if: ${{ inputs.tag-required }}
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.pack.outputs.package-version }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          tag="${tag#v}"
          test "$tag" = "$PACKAGE_VERSION" || {
            echo "git tag $tag 与包版本 $PACKAGE_VERSION 不一致" >&2
            exit 1
          }

      - name: 上传已验证发布物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ailuo-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  # Release 发布单独成 job：只有它需要 contents: write，且只在 tag 发布时运行。
  publish:
    name: publish
    needs: package
    if: ${{ inputs.tag-required }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ailuo-package
          path: package-artifact
      # 只检出固定版本的 CLI；不检出或执行调用方仓库代码。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: projectluojia/AI-Luo-Man-ga
          ref: e7d0d0ace4d7f01bb704513159d9a760cc82c28d
          path: .ailuo-cli
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .ailuo-cli/go.mod
          cache: true
      - name: 构建 ailuo CLI
        run: go build -o ailuo .
        working-directory: .ailuo-cli
      - name: 发布到 GitHub Release（tag 时，版本不可变）
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACKAGE_TARBALL_DIR: ${{ github.workspace }}/package-artifact
        run: |
          set -euo pipefail
          tarball="$(find "$PACKAGE_TARBALL_DIR" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          ./.ailuo-cli/ailuo publish --repo "$REPOSITORY" "$tarball"
      - name: 从注册表安装验证（发布物真实闭环）
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACKAGE_ID: ${{ needs.package.outputs.package-id }}
          PACKAGE_VERSION: ${{ needs.package.outputs.package-version }}
        run: |
          set -euo pipefail
          ./.ailuo-cli/ailuo install --root "$RUNNER_TEMP/pkgroot-registry" "$REPOSITORY@$PACKAGE_VERSION"
          ./.ailuo-cli/ailuo list --root "$RUNNER_TEMP/pkgroot-registry" | grep -q "^${PACKAGE_ID}@${PACKAGE_VERSION}"
