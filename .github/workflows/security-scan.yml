name: 安全依赖扫描

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - contracts/**
      - package-manager/**
      - packages/campus-bus/go.mod
      - go.work
      - go.work.sum
      - packages/agent/**
      - packages/campus-bus/**
      - .github/workflows/security-scan.yml
  pull_request:
    paths:
      - go.mod
      - go.sum
      - contracts/**
      - package-manager/**
      - packages/campus-bus/go.mod
      - go.work
      - go.work.sum
      - packages/agent/**
      - packages/campus-bus/**
      - .github/workflows/security-scan.yml
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC 全量扫描
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Go 依赖漏洞：基于完整模块图（含传递依赖）。先构建本机工具，
      # 再为 WASI guest 设置目标平台；不能直接让 go run 自身交叉编译。
      - name: 安装 govulncheck
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: 运行 govulncheck
        id: govulncheck
        shell: bash
        run: |
          set -uo pipefail
          vulnerability_found=0
          scan_failed=0
          run_scan() {
            local module="$1"
            local exit_code
            shift
            echo "检查 Go module: $module"
            if (cd "$module" && "$@"); then
              return 0
            else
              exit_code=$?
            fi
            case "$exit_code" in
              3)
                vulnerability_found=1
                ;;
              *)
                scan_failed=1
                ;;
            esac
          }
          while IFS= read -r -d '' go_mod; do
            module="${go_mod%/go.mod}"
            echo "检查 Go module: $module"
            host_packages=""
            if ! host_packages="$(cd "$module" && go list ./... 2>/dev/null)"; then
              host_packages=""
            fi
            if [[ -n "$host_packages" ]]; then
              run_scan "$module" govulncheck ./...
            fi
            wasi_packages=""
            if ! wasi_packages="$(cd "$module" && GOOS=wasip1 GOARCH=wasm go list ./... 2>/dev/null)"; then
              wasi_packages=""
            fi
            if [[ -n "$wasi_packages" ]]; then
              run_scan "$module" env GOOS=wasip1 GOARCH=wasm govulncheck ./...
            fi
            if [[ -z "$host_packages" && -z "$wasi_packages" ]]; then
              echo "Go module 没有可扫描的 package: $module" >&2
              scan_failed=1
            fi
          done < <(find . -name go.mod -not -path './.git/*' -print0 | sort -z)
          if (( scan_failed )); then
            status=error
          elif (( vulnerability_found )); then
            status=vulnerable
          else
            status=ok
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      # 扫描 Core 与同仓包工作区内的 Go/Python 锁定依赖。
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        id: osv
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          scan-args: |-
            --format=sarif
            --output=results.sarif
            --recursive
            .
      - name: 上传扫描结果为构建产物
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sarif-results
          path: results.sarif
          if-no-files-found: error
          retention-days: 7
      - name: 报告扫描结果
        if: always()
        env:
          GOVULNCHECK_STATUS: ${{ steps.govulncheck.outputs.status }}
          OSV_OUTCOME: ${{ steps.osv.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GOVULNCHECK_STATUS" != ok || "$OSV_OUTCOME" != success || "$UPLOAD_OUTCOME" != success ]]; then
            echo "安全扫描失败：govulncheck=$GOVULNCHECK_STATUS osv=$OSV_OUTCOME upload=$UPLOAD_OUTCOME" >&2
            exit 1
          fi

  upload:
    name: upload
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # 读取前一个 job 上传的 SARIF 工件。
      security-events: write # 将扫描结果写入 GitHub Code Scanning。
    if: ${{ always() && needs.scan.result != 'cancelled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: 下载扫描结果
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sarif-results
      - name: 上传 SARIF 到 GitHub 安全分析
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
