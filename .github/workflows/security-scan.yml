name: 安全依赖扫描

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - contracts/**
      - package-manager/**
      - packages/campus-bus/go.mod
      - go.work
      - go.work.sum
      - packages/agent/**
      - packages/campus-bus/**
      - .github/workflows/security-scan.yml
  pull_request:
    paths:
      - go.mod
      - go.sum
      - contracts/**
      - package-manager/**
      - packages/campus-bus/go.mod
      - go.work
      - go.work.sum
      - packages/agent/**
      - packages/campus-bus/**
      - .github/workflows/security-scan.yml
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC 全量扫描
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Go 依赖漏洞：基于完整模块图（含传递依赖）。
      - name: 运行 govulncheck
        shell: bash
        run: |
          set -euo pipefail
          for module in . contracts package-manager packages/campus-bus; do
            echo "检查 Go module: $module"
            (cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)
          done
      # 扫描 Core 与同仓包工作区内的 Go/Python 锁定依赖。
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --format=sarif
            --output=results.sarif
            --recursive
            .
      - name: 上传扫描结果为构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sarif-results
          path: results.sarif
          if-no-files-found: error
          retention-days: 7

  upload:
    name: upload
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # 读取前一个 job 上传的 SARIF 工件。
      security-events: write # 将扫描结果写入 GitHub Code Scanning。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: 下载扫描结果
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sarif-results
      - name: 上传 SARIF 到 GitHub 安全分析
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
