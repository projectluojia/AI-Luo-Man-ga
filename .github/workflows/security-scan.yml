name: 安全依赖扫描

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - agent/pyproject.toml
      - agent/uv.lock
      - .github/workflows/security-scan.yml
  pull_request:
    paths:
      - go.mod
      - go.sum
      - agent/pyproject.toml
      - agent/uv.lock
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC 全量扫描
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Go 依赖漏洞：基于完整模块图（含传递依赖）。
      - name: 运行 govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      # Python 依赖漏洞（agent/uv.lock）与仓库内其余锁定文件。
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --format=sarif
            --output=results.sarif
            --recursive
            .
      - name: 上传扫描结果为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sarif-results
          path: results.sarif

  upload:
    name: upload
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: 下载扫描结果
        uses: actions/download-artifact@v4
        with:
          name: sarif-results
      - name: 上传 SARIF 到 GitHub 安全分析
        uses: github/codeql-action/upload-sarif@faaa5d804fc648d0fdb28822a8e36cf7d0a6132c # v4.37.7
        with:
          sarif_file: results.sarif
