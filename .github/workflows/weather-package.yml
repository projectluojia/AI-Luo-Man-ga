name: Weather package

# Weather isolated provider 包拥有独立的 CI 边界；迁移到独立仓库时可直接携带本文件。
# 该流程不依赖 Agent 包，也不参与 Core 的 ci-required。

on:
  push:
    branches: [main]
    paths:
      - packages/weather/**
      - contracts/**
      - package-manager/**
      - go.work
      - go.work.sum
      - .github/workflows/weather-package.yml
  pull_request:
    paths:
      - packages/weather/**
      - contracts/**
      - package-manager/**
      - go.work
      - go.work.sum
      - .github/workflows/weather-package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Weather package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/weather/go.mod
          cache: true
          cache-dependency-path: |
            packages/weather/go.mod
            contracts/go.sum
            package-manager/go.sum
            go.work.sum
      - name: 校验天气 Go module 与原生构建
        working-directory: packages/weather
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy -diff
          go vet ./src/...
          go test ./src/...
      - name: 构建 Package Manager CLI
        working-directory: package-manager
        run: |
          go build -o "$RUNNER_TEMP/ailuo" ./cmd/ailuo-pm
      - name: 打包 Weather
        run: |
          "$RUNNER_TEMP/ailuo" pack packages/weather "$RUNNER_TEMP/weather-package-dist"
      - name: 安装并验证 Weather 发布物
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t weather_tarballs < <(find "$RUNNER_TEMP/weather-package-dist" -maxdepth 1 -type f -name 'weather-*.tgz' -print)
          test "${#weather_tarballs[@]}" -eq 1
          weather_tgz="${weather_tarballs[0]}"
          weather_version="$(tar -xzOf "$weather_tgz" manifest.json | jq -er .version)"
          "$RUNNER_TEMP/ailuo" install --root "$RUNNER_TEMP/weather-package-root" "$weather_tgz"
          "$RUNNER_TEMP/ailuo" list --root "$RUNNER_TEMP/weather-package-root" | grep -q "^weather@${weather_version}"
