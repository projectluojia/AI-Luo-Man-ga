name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-tests:
    name: 核心测试 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: 同步 Python 环境
        run: uv sync --project agent --locked
      - name: 校验 Go 模块
        run: go mod verify
      - name: 运行 Go 单元测试
        run: go test ./...
      - name: 编译 Python Agent
        run: uv run --project agent --locked python -m compileall -q agent
      - name: 运行 Python Agent 单元测试
        run: uv run --project agent --locked python -m unittest discover -s agent -p "test_*.py" -v

  linux-quality:
    name: Linux 完整质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: 同步 Python 环境
        run: uv sync --project agent --locked
      - name: 检查 Go 格式
        shell: bash
        run: |
          files="$(gofmt -l .)"
          test -z "$files" || { echo "$files"; exit 1; }
      - name: 运行 Go vet
        run: go vet ./...
      - name: 运行 Go race 测试
        run: go test -race ./...
      - name: 运行 Runtime Host 集成测试
        run: go test -tags=integration ./internal/kernel/loader -v -timeout=30s
      - name: 运行 Go → Python 端到端测试
        run: go test -tags=integration ./e2e -v -timeout=30s
      - name: 检查工作树未被验证步骤修改
        run: git diff --exit-code
