name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 三平台核心测试：Go 覆盖 Windows/Linux/macOS 可构建可测试契约。
  # 合并门禁统一使用末尾的 ci-required，单个 job 名称可独立演进。
  test:
    name: 核心测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go_test_flags: ""
          - os: windows-latest
            go_test_flags: "-p 1"
          - os: macos-latest
            go_test_flags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 校验 Go 模块（go.sum 完整性）
        run: go mod verify
      - name: 运行 Go 单元测试
        run: go test ${{ matrix.go_test_flags }} ./...

  # Linux 完整质量门禁：只在 Linux 执行一次全量 race，避免三平台重复开销。
  quality-linux:
    name: Linux 完整质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 校验 go.mod/go.sum 无漂移
        # go mod tidy 的结论与平台相关（Windows 依赖 x/sys 等），只在单一 Linux job 校验。
        run: go mod tidy -diff
      - name: 检查 Go 格式
        shell: bash
        run: |
          files="$(gofmt -l .)"
          test -z "$files" || { echo "$files"; exit 1; }
      - name: 运行 Go vet
        run: go vet ./...
      - name: 运行 staticcheck
        # 默认检查集排除 SA1019（grpc.DialContext/WithBlock 弃用）：迁移到
        # grpc.NewClient 涉及内核拨号语义与 15 处测试同步，作为独立重构任务跟进。
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 '-checks=inherit,-SA1019' ./...
      - name: 运行 Go race 测试
        run: go test -race ./...
      - name: 运行 Runtime Host 集成测试
        run: go test -tags=integration ./internal/kernel/loader -v -timeout=30s
      - name: 检查工作树未被验证步骤修改
        run: git diff --exit-code

  # 生成物漂移检查：proto 是版本化契约，生成文件为提交构件，重新生成后必须零差异。
  proto-drift:
    name: proto-drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: packages/agent/runtime/uv.lock
      - name: 同步协议生成工具环境
        run: uv sync --project packages/agent/runtime --locked
      - name: 安装与提交产物一致的 Go protoc 插件
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: 重新生成并检查无漂移
        run: |
          go_bin="$(go env GOPATH)/bin"
          export PATH="$go_bin:$PATH"
          uv run --project packages/agent/runtime --locked python -m grpc_tools.protoc -I proto --go_out=. --go_opt=module=github.com/projectluojia/AI-Luo-Man-ga --go-grpc_out=. --go-grpc_opt=module=github.com/projectluojia/AI-Luo-Man-ga proto/executor.proto proto/runtime_host.proto
          uv run --project packages/agent/runtime --locked python -m grpc_tools.protoc -I proto --python_out=packages/agent/runtime/agent/generated --grpc_python_out=packages/agent/runtime/agent/generated proto/executor.proto
          git diff --exit-code

  # Docker Compose 编排语法校验（QQ OneBot 容器）。
  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 校验 Docker Compose 配置
        run: docker compose -f docker/qq-onebot.compose.yaml config --quiet

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 检查 GitHub Actions workflow
        shell: bash
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - test
      - quality-linux
      - proto-drift
      - compose-config
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 汇总 CI 门禁
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality-linux.result }}
          PROTO_RESULT: ${{ needs.proto-drift.result }}
          COMPOSE_RESULT: ${{ needs.compose-config.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-lint.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$TEST_RESULT" "$QUALITY_RESULT" "$PROTO_RESULT" "$COMPOSE_RESULT" "$WORKFLOW_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "CI job result: $result" >&2
              exit 1
            fi
          done
