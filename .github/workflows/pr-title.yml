name: PR 标题规范

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  main:
    name: 校验 Conventional Commits 标题
    runs-on: ubuntu-latest
    steps:
      - name: 校验版本前缀与 Conventional Commits 类型
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          title="$PR_TITLE"
          if [[ "$title" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\ (.*)$ ]]; then
            title="${BASH_REMATCH[1]}"
          else
            echo "PR 标题必须以 vMAJOR.MINOR.PATCH.MICRO 开头" >&2
            exit 1
          fi
          if [[ ! "$title" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()]+\))?:\ .+ ]]; then
            echo "PR 标题不是允许的 Conventional Commit 格式: $PR_TITLE" >&2
            exit 1
          fi
