name: Packages

# packages/ 下全部可安装包共享一条矩阵流水线：module 校验 + 测试 +
# pack + 冒烟安装；hosted 包执行原生业务测试、已有集成测试与 wasip1 vet，isolated 包执行原生 vet/test。
# guestkit（guest 侧共享 ABI 库，非可安装包）由独立 job 校验。
# 各包迁移到独立仓库时，把对应 matrix 条目复制为独立 workflow。
# 该流程不参与 Core 的 ci-required。

on:
  push:
    branches: [main]
    paths:
      - packages/**
      - guestkit/**
      - contracts/**
      - package-manager/**
      - internal/**
      - testsupport/**
      - go.mod
      - go.sum
      - go.work
      - go.work.sum
      - .github/workflows/packages.yml
  pull_request:
    paths:
      - packages/**
      - guestkit/**
      - contracts/**
      - package-manager/**
      - internal/**
      - testsupport/**
      - go.mod
      - go.sum
      - go.work
      - go.work.sum
      - .github/workflows/packages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guestkit:
    name: guestkit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: guestkit/go.mod
          cache: true
          cache-dependency-path: guestkit/go.mod
      - name: 校验 guestkit Go module
        working-directory: guestkit
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy -diff
          go test ./...

  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # hosted（wasm guest，ABI 1）；id 为安装发布物中的包 ID（目录名可不同）
          # 集成夹具位于根模块，必须显式选中；./... 只覆盖当前业务模块的原生测试。
          - { package: timetable,   id: timetable, kind: hosted, test_targets: './... ../../testsupport/timetabletest' }
          - { package: classroom,   id: classroom, kind: hosted, test_targets: './... ../../testsupport/classroomtest' }
          - { package: calendar,    id: calendar,  kind: hosted, test_targets: './... ../../testsupport/calendartest' }
          - { package: library,     id: library,   kind: hosted, test_targets: './... ../../testsupport/librarytest' }
          - { package: sports,      id: sports,    kind: hosted, test_targets: './... ../../testsupport/sportstest' }
          - { package: ecard,       id: ecard,     kind: hosted, test_targets: './... ../../testsupport/ecardtest' }
          - { package: campus-bus,  id: campus,    kind: hosted, test_targets: './...' }
          # isolated（原生进程）
          - { package: weather,     id: weather,   kind: isolated }
          # agent 是 executor 包（isolated，Python runtime），由 agent-package.yml 校验
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/${{ matrix.package }}/go.mod
          cache: true
          cache-dependency-path: |
            packages/${{ matrix.package }}/go.mod
            guestkit/go.mod
            contracts/go.sum
            package-manager/go.sum
      - name: 校验 ${{ matrix.package }} Go module、静态检查与测试
        working-directory: packages/${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy -diff
          if [ "${{ matrix.kind }}" = hosted ]; then
            go test -count=1 -tags=integration -timeout=5m ${{ matrix.test_targets }}
            GOOS=wasip1 GOARCH=wasm go vet ./src
          else
            go vet ./src/...
            go test ./src/...
          fi
      - name: 构建 Package Manager CLI
        working-directory: package-manager
        run: |
          go build -o "$RUNNER_TEMP/ailuo" ./cmd/ailuo-pm
      - name: 打包 ${{ matrix.package }}
        run: |
          "$RUNNER_TEMP/ailuo" pack "packages/${{ matrix.package }}" "$RUNNER_TEMP/package-dist"
      - name: 安装并验证 ${{ matrix.package }} 发布物
        shell: bash
        run: |
          set -euo pipefail
          package_id="${{ matrix.id }}"
          mapfile -t package_tarballs < <(find "$RUNNER_TEMP/package-dist" -maxdepth 1 -type f -name "${package_id}-*.tgz" -print)
          test "${#package_tarballs[@]}" -eq 1
          package_tgz="${package_tarballs[0]}"
          package_version="$(tar -xzOf "$package_tgz" manifest.json | jq -er .version)"
          "$RUNNER_TEMP/ailuo" install --root "$RUNNER_TEMP/package-root" "$package_tgz"
          "$RUNNER_TEMP/ailuo" list --root "$RUNNER_TEMP/package-root" | grep -q "^${package_id}@${package_version}"
