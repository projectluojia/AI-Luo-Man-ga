openapi: 3.1.0
info:
  title: AI珞（爱珞） V3 Web Access API
  version: 2.0.0
  description: Every HTTP response carries X-Request-ID, X-Trace-ID, and a W3C traceparent generated from validated input correlation headers.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v2/echoes:
    post:
      summary: Idempotently create and schedule an Echo
      description: >-
        Requires a trusted server-side Web login identity. Request body fields never
        establish user or session ownership. When no Web authenticator is configured,
        this endpoint fails closed with 401. Echo, attempt-1 Run, and the App-scoped
        idempotency mapping are committed in one transaction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        "202":
          description: A new Echo and queued Run were atomically accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EchoAccepted"
        "200":
          description: The stored response for the same key and request was replayed.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EchoAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: No valid trusted Web login identity is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The resolved user is disabled or is not a member of the current App.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The Idempotency-Key is already bound to a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/QueueFull"
        "503":
          description: The App is disabled or its persisted configuration is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/echoes/{echo_id}:
    parameters:
      - $ref: "#/components/parameters/EchoID"
    get:
      summary: Get Echo state and persisted events
      responses:
        "200":
          description: Echo state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EchoState"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      summary: Cancel a running Echo
      responses:
        "204":
          description: Cancellation requested
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/echoes/{echo_id}/events:
    parameters:
      - $ref: "#/components/parameters/EchoID"
    get:
      summary: Stream persisted and live Echo events
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Each data field is a serialized EchoEvent; event ids are monotonically increasing within the App-scoped Echo.
        "404":
          description: The Echo does not exist in the current App. This response does not disclose whether the identifier exists in another App.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/runs/{run_id}:
    get:
      summary: Get an App-scoped Run
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Durable Run status, including a completed user-visible result when present.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [run]
                properties:
                  run:
                    $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/capabilities:
    get:
      summary: List capabilities enabled for the current App
      responses:
        "200":
          description: Capability list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Capability"
        "503":
          description: The App is disabled or its persisted Capability policy is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/capabilities/{capability_id}/invoke:
    post:
      summary: Invoke an enabled Capability with a governed payload
      description: >-
        Synchronous consumer entry point used by generated SDKs. The request body
        is a single-input envelope; the App policy, permission narrowing, input
        schema validation and idempotency/confirmation governance are enforced by
        the kernel Dispatcher. Unknown request fields and trailing content are
        rejected.
      parameters:
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: X-Confirmation-ID
          in: header
          required: false
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input]
              properties:
                input:
                  description: Capability input payload validated against its registered JSON Schema.
      responses:
        "200":
          description: Capability result envelope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [capability_id, result]
                properties:
                  capability_id:
                    type: string
                  result:
                    description: Capability output payload.
        "400":
          description: Malformed request body, schema violation, or missing idempotency key for a side-effecting Capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Web authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The App is not granted the required permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The idempotency key conflicts or the Capability requires confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Capability invocation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The Capability does not exist or is not enabled for the App.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: App policy, idempotency store, or the invoke endpoint itself is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The synchronous Capability deadline expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/config:
    servers:
      - url: http://127.0.0.1:9178
    get:
      summary: Read the local Deployment startup configuration
      description: >-
        Loopback-only, same-origin management endpoint. It remains available while
        the business kernel is waiting for configuration or restarting. Secret
        values are never returned; only configured flags are exposed.
      responses:
        "200":
          description: Current non-secret settings, secret presence, and runtime status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentConfigSnapshot"
        "403":
          $ref: "#/components/responses/Error"
    put:
      summary: Compare-and-swap the local Deployment startup configuration
      description: >-
        A successful write stores a new revision and asks the Go supervisor to
        start or restart the business kernel. Empty secret fields preserve existing
        values. NapCat itself remains an independently managed process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentConfigUpdate"
      responses:
        "200":
          description: Configuration persisted and scheduled for application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentConfigSnapshot"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /chat/stream:
    post:
      summary: Stream a product-frontend chat message (SSE)
      description: >
        Product frontend contract (LuoYing-Frontend). The message enters the
        governed platform chain (standard Intake -> idempotent Echo creation ->
        event translation) and is delivered as a text/event-stream with events
        track, text_delta, final, error and done. The kernel echo events are
        translated; kernel event types are not exposed.
        A trusted server-side Web login identity is required; identity and
        session ownership come exclusively from that server-side identity.
      security:
        - webAuthenticator: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                image_ids:
                  type: array
                  items:
                    type: string
                  description: Unsupported in the current slice; non-empty arrays are rejected.
                file_ids:
                  type: array
                  items:
                    type: string
                  description: Unsupported in the current slice; non-empty arrays are rejected.
      responses:
        "200":
          description: SSE event stream (track/text_delta/final/error/done)
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid body, message length, unknown field, or unsupported attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid trusted Web login identity is available or it is not bound to an internal user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The service is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /healthz:
    get:
      summary: Process liveness
      responses:
        "200":
          description: The Go process is alive. No dependency is probed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: live
  /readyz:
    get:
      summary: Service readiness
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ready
        "503":
          $ref: "#/components/responses/Error"
  /metrics:
    get:
      summary: Prometheus process metrics
      description: Exposes fixed, low-cardinality operational metrics without App, Echo, Run, call, payload, ExecutorConfig, or credential labels.
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /api/v1/ingress/{platform}:
    post:
      summary: Ingest one normalized platform event
      description: >-
        Unified platform event entry. Platform adapters normalize raw events and POST
        them here; the kernel resolves the platform identity to an internal user,
        persists the standard session/message, and idempotently creates the Echo.
        Empty or unbound user identities are rejected before any persistence; there is
        no anonymous sender or anonymous session fallback. Repeated delivery with the
        same platform_message_id and idempotency_key replays the stored Echo with created=false; the same
        platform_message_id with a different idempotency_key is rejected as a conflict.
      parameters:
        - name: platform
          in: path
          required: true
          description: Platform identifier used in identity binding, lowercase letters, digits, dot, underscore, hyphen.
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformEvent"
      responses:
        "200":
          description: The message was persisted and its Echo was created or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeAccepted"
        "400":
          description: Invalid event fields, malformed JSON, unknown fields, or an invalid platform identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The platform identity is not bound to an internal user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The platform identity is rejected or its user is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The same platform_message_id was already persisted with a different idempotency_key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/QueueFull"
        "500":
          description: Internal error; safe public message only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    webAuthenticator:
      type: apiKey
      in: header
      name: Authorization
      description: Deployment-specific Web authentication material validated by the configured WebAuthenticator.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: App-scoped client operation identifier. Reuse is valid only with the identical normalized request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    EchoID:
      name: echo_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    DeploymentConfigUpdate:
      type: object
      additionalProperties: false
      required:
        - revision
        - app_id
        - executor_id
        - executor_timeout_seconds
        - execution
        - orchestration
        - context_assembly
        - scheduler
        - qq_connection
        - runtime_process
        - governance
        - qq_enabled
        - qq_ws_url
        - qq_ws_token
        - clear_qq_ws_token
        - qq_bot_id
        - qq_allowed_group_ids
        - qq_allowed_private_user_ids
      properties:
        revision:
          type: integer
          minimum: 0
        app_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
        executor_id:
          type: string
          minLength: 1
          maxLength: 256
        executor_config:
          writeOnly: true
          description: Opaque JSON interpreted only by the selected Executor package.
        execution:
          $ref: "#/components/schemas/ExecutionSettings"
        orchestration:
          $ref: "#/components/schemas/OrchestrationSettings"
        context_assembly:
          $ref: "#/components/schemas/ContextAssemblySettings"
        scheduler:
          $ref: "#/components/schemas/SchedulerSettings"
        qq_connection:
          $ref: "#/components/schemas/QQConnectionSettings"
        runtime_process:
          $ref: "#/components/schemas/RuntimeProcessSettings"
        governance:
          $ref: "#/components/schemas/GovernanceSettings"
        executor_timeout_seconds:
          type: number
          minimum: 0.1
          maximum: 120
        qq_enabled:
          type: boolean
        qq_ws_url:
          type: string
          description: OneBot v11 ws:// or wss:// endpoint exposed independently by NapCat.
        qq_ws_token:
          type: string
          writeOnly: true
          maxLength: 4096
          description: Empty preserves the current token unless clear_qq_ws_token is true.
        clear_qq_ws_token:
          type: boolean
        qq_bot_id:
          type: string
          pattern: "^[1-9][0-9]{0,19}$"
        qq_allowed_group_ids:
          type: array
          maxItems: 1024
          items:
            type: string
            pattern: "^[1-9][0-9]{0,19}$"
        qq_allowed_private_user_ids:
          type: array
          maxItems: 1024
          items:
            type: string
            pattern: "^[1-9][0-9]{0,19}$"
        qq_quick_replies:
          type: array
          maxItems: 64
          description: Exact QQ Access replies handled before identity, message persistence, Echo, and Executor execution.
          items:
            $ref: "#/components/schemas/QQQuickReply"
        qq_poke_replies:
          type: array
          maxItems: 64
          description: Random plain-text replies for poke notices. An empty array disables poke text while retaining group poke-back.
          items:
            type: string
            minLength: 1
            maxLength: 4000
    QQQuickReply:
      type: object
      additionalProperties: false
      required: [trigger, reply]
      properties:
        trigger:
          type: string
          minLength: 1
          maxLength: 128
        reply:
          type: string
          minLength: 1
          maxLength: 4000
    DeploymentConfigSnapshot:
      type: object
      additionalProperties: false
      required: [settings, qq_ws_token_configured, runtime]
      properties:
        settings:
          type: object
          additionalProperties: false
          required:
            - revision
            - app_id
            - executor_id
            - executor_timeout_seconds
            - qq_enabled
            - qq_ws_url
            - qq_bot_id
            - qq_allowed_group_ids
            - qq_allowed_private_user_ids
            - qq_quick_replies
            - qq_poke_replies
            - execution
            - orchestration
            - context_assembly
            - scheduler
            - qq_connection
            - runtime_process
            - governance
            - updated_at
          properties:
            revision:
              type: integer
              minimum: 0
            app_id:
              type: string
              maxLength: 128
              pattern: "^(?:[a-z0-9][a-z0-9._-]{0,127})?$"
              description: Empty only before the first local configuration is saved.
            executor_id:
              type: string
            executor_timeout_seconds:
              type: number
            qq_enabled:
              type: boolean
            qq_ws_url:
              type: string
            qq_bot_id:
              type: string
            qq_allowed_group_ids:
              type: array
              items:
                type: string
            qq_allowed_private_user_ids:
              type: array
              items:
                type: string
            qq_quick_replies:
              type: array
              items:
                $ref: "#/components/schemas/QQQuickReply"
            qq_poke_replies:
              type: array
              items:
                type: string
            execution:
              $ref: "#/components/schemas/ExecutionSettings"
            orchestration:
              $ref: "#/components/schemas/OrchestrationSettings"
            context_assembly:
              $ref: "#/components/schemas/ContextAssemblySettings"
            scheduler:
              $ref: "#/components/schemas/SchedulerSettings"
            qq_connection:
              $ref: "#/components/schemas/QQConnectionSettings"
            runtime_process:
              $ref: "#/components/schemas/RuntimeProcessSettings"
            governance:
              $ref: "#/components/schemas/GovernanceSettings"
            updated_at:
              type: string
              format: date-time
        qq_ws_token_configured:
          type: boolean
        runtime:
          type: object
          additionalProperties: false
          required: [state, message, revision]
          properties:
            state:
              type: string
              enum: [setup_required, starting, restarting, ready, failed]
            message:
              type: string
            revision:
              type: integer
              minimum: 0
    ExecutionSettings:
      type: object
      additionalProperties: false
      required: [max_steps, max_capability_calls, max_execution_units, max_output_bytes, max_cost_microusd]
      properties:
        max_steps:
          type: integer
          minimum: 1
          maximum: 64
        max_capability_calls:
          type: integer
          minimum: 1
          maximum: 256
        max_execution_units:
          type: integer
          minimum: 1
          maximum: 1000000000
        max_output_bytes:
          type: integer
          minimum: 1
          maximum: 262144
        max_cost_microusd:
          type: integer
          minimum: 0
          maximum: 1000000000000000
    OrchestrationSettings:
      type: object
      additionalProperties: false
      required: [run_timeout_seconds, max_run_attempts, queue_capacity, max_call_depth]
      properties:
        run_timeout_seconds:
          type: number
          minimum: 1
          maximum: 600
        max_run_attempts:
          type: integer
          minimum: 1
          maximum: 10
        queue_capacity:
          type: integer
          minimum: 1
          maximum: 10000
        max_call_depth:
          type: integer
          minimum: 1
          maximum: 64
    ContextAssemblySettings:
      type: object
      additionalProperties: false
      required: [max_messages, max_chars_per_msg, max_total_chars, max_context_bytes]
      properties:
        max_messages:
          type: integer
          minimum: 1
          maximum: 1000
        max_chars_per_msg:
          type: integer
          minimum: 1
          maximum: 65536
        max_total_chars:
          type: integer
          minimum: 1
          maximum: 1048576
        max_context_bytes:
          type: integer
          minimum: 1
          maximum: 65536
    SchedulerSettings:
      type: object
      additionalProperties: false
      required: [workers, poll_ms, batch_size]
      properties:
        workers:
          description: Number of persistent Run scheduler workers; configurable per App.
          type: integer
          minimum: 1
          maximum: 64
        poll_ms:
          type: integer
          minimum: 10
          maximum: 60000
        batch_size:
          type: integer
          minimum: 1
          maximum: 1000
    QQConnectionSettings:
      type: object
      additionalProperties: false
      required: [dial_timeout_seconds, reconnect_delay_seconds, run_timeout_seconds, manager_stop_timeout_seconds]
      properties:
        dial_timeout_seconds:
          type: number
          minimum: 0.1
          maximum: 120
        reconnect_delay_seconds:
          type: number
          minimum: 0.1
          maximum: 600
        run_timeout_seconds:
          type: number
          minimum: 1
          maximum: 3600
        manager_stop_timeout_seconds:
          type: number
          minimum: 1
          maximum: 120
    RuntimeProcessSettings:
      type: object
      additionalProperties: false
      required: [dial_timeout_seconds, stop_grace_seconds, terminate_grace_seconds]
      properties:
        dial_timeout_seconds:
          type: number
          minimum: 1
          maximum: 120
        stop_grace_seconds:
          type: number
          minimum: 1
          maximum: 120
        terminate_grace_seconds:
          type: number
          minimum: 1
          maximum: 60
    GovernanceSettings:
      type: object
      additionalProperties: false
      required: [confirmation_sweep_seconds]
      properties:
        confirmation_sweep_seconds:
          type: number
          minimum: 10
          maximum: 86400
    PlatformEvent:
      type: object
      additionalProperties: false
      required: [platform_channel, platform_space_id, platform_user_id, platform_session_id, platform_message_id, message_type, text, occurred_at, idempotency_key]
      properties:
        platform_channel:
          type: string
          enum: [private, group]
          description: Determines direct versus group session semantics.
        platform_space_id:
          type: string
          description: Required platform space (group/channel) identifier.
          minLength: 1
          maxLength: 128
        platform_user_id:
          type: string
          description: Required opaque platform user identifier. Control characters are rejected.
          minLength: 1
          maxLength: 256
        platform_session_id:
          type: string
          description: Required platform-side session identifier used in the versioned session key.
          minLength: 1
          maxLength: 256
        platform_message_id:
          type: string
          description: Stable platform message identifier, deduplicated per App and platform.
          minLength: 1
          maxLength: 128
        message_type:
          type: string
          description: Standard message type, e.g. text.
          minLength: 1
        text:
          type: string
          minLength: 1
          maxLength: 4000
        reply_to:
          type: string
        occurred_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
          description: App-scoped idempotency key shared between message persistence and Echo creation.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    IntakeAccepted:
      type: object
      additionalProperties: false
      required: [echo_id, session_id, message_id, sender_user_id, created]
      properties:
        echo_id:
          type: string
        session_id:
          type: string
          description: Opaque session-v1 digest scoped by App, platform, channel, space and platform session; direct sessions also include the internal user.
        message_id:
          type: string
        sender_user_id:
          type: string
          description: Resolved internal user. Anonymous senders are not supported.
        created:
          type: boolean
          description: False when the delivery replayed an already persisted message and Echo.
    Capability:
      type: object
      additionalProperties: false
      required: [id, version, name, description, service_id, input_schema_json, side_effect, requires_confirmation]
      properties:
        id:
          type: string
        version:
          type: string
        name:
          type: string
        description:
          type: string
        service_id:
          type: string
        input_schema_json:
          type: string
          description: Registered strict JSON Schema serialized as JSON.
        side_effect:
          type: string
          enum: [none, read, write, external]
        requires_confirmation:
          type: boolean
        required_permissions:
          type: array
          items:
            type: string
    EchoAccepted:
      type: object
      required: [echo_id, status_url, events_url]
      properties:
        echo_id:
          type: string
          format: uuid
        status_url:
          type: string
        events_url:
          type: string
    Echo:
      type: object
      additionalProperties: false
      required: [echo_id, app_id, input_message, status, created_at]
      properties:
        echo_id:
          type: string
        app_id:
          type: string
        input_message:
          type: string
        status:
          type: string
          enum: [running, succeeded, failed, cancelled]
        final_message:
          type: string
        error_code:
          type: string
          description: Stable safe error code. Internal causes are never returned.
        error_message:
          type: string
          description: Safe localized message. Internal errors, provider bodies, paths, and credentials are never returned.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    EchoEvent:
      type: object
      additionalProperties: false
      required: [app_id, echo_id, sequence, type, payload, created_at]
      properties:
        app_id:
          type: string
        echo_id:
          type: string
        run_id:
          type: string
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
        payload: {}
        created_at:
          type: string
          format: date-time
    Run:
      type: object
      additionalProperties: false
      required:
        - run_id
        - run_group_id
        - app_id
        - echo_id
        - attempt
        - status
        - executor_id
        - config_revision
        - protocol_version
        - max_steps
        - max_capability_calls
        - max_execution_units
        - max_output_bytes
        - max_cost_microusd
        - execution_timeout_ms
        - used_execution_units
        - used_cost_microusd
        - used_retries
        - deadline
        - available_at
        - last_executor_sequence
        - created_at
      properties:
        run_id:
          type: string
        run_group_id:
          type: string
          description: Stable identity shared by retry attempts of one logical execution group.
        app_id:
          type: string
        echo_id:
          type: string
        parent_run_id:
          type: string
          description: Optional causal parent Run identity supplied by a governed executor flow.
        origin_call_id:
          type: string
          description: Optional originating CapabilityCall identity in a causal execution chain.
        attempt:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, timed_out]
        executor_id:
          type: string
        config_revision:
          type: string
        protocol_version:
          type: string
        max_steps:
          type: integer
          minimum: 1
        max_capability_calls:
          type: integer
          minimum: 1
        max_execution_units:
          type: integer
          minimum: 1
        max_output_bytes:
          type: integer
          minimum: 1
        max_cost_microusd:
          type: integer
          minimum: 0
        execution_timeout_ms:
          type: integer
          minimum: 100
        used_execution_units:
          type: integer
          minimum: 0
        used_cost_microusd:
          type: integer
          minimum: 0
        used_retries:
          type: integer
          minimum: 0
          maximum: 320
        deadline:
          type: string
          format: date-time
        available_at:
          type: string
          format: date-time
          description: Earliest durable scheduling time for this Run attempt.
        lease_expires_at:
          type: string
          format: date-time
        last_executor_sequence:
          type: integer
          minimum: 0
        capability_scope:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Persisted acceptance-time Capability ceiling for this Run; later internal calls can only narrow it.
          items:
            type: string
        error_code:
          type: string
          description: Stable safe error code.
        error_message:
          type: string
          description: Safe localized error message.
        result:
          type: string
          description: Completed user-visible Run output; task text, ExecutorConfig, reasoning, and Tool arguments are never included.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    EchoState:
      type: object
      additionalProperties: false
      required: [echo, runs, events]
      properties:
        echo:
          $ref: "#/components/schemas/Echo"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EchoEvent"
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Safe localized message without internal error details.
  responses:
    QueueFull:
      description: The App-scoped durable Run capacity is exhausted. An idempotent replay of an already accepted request is still allowed.
      headers:
        Retry-After:
          description: Minimum client retry delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  headers:
    IdempotencyReplayed:
      description: True when the response came from the durable idempotency mapping and no new work was scheduled.
      schema:
        type: string
        const: "true"
